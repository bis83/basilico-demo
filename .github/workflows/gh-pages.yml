name: gh-pages

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: actions/setup-go@v5
        with:
          go-version: 1.24
      - name: Get Basilico
        run: go get tool
      - name: Execute Basilico
        run: |
          go tool basilico demo build
          go tool basilico deephack build
          go tool basilico deepone build
          go tool basilico kurenai build
          go tool basilico salvage build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
